name: Build Keyboard

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  device-build:
    name: Build unsigned IPA (device)
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select recent Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.4.1.app

      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: build/DerivedData/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve SwiftPM dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Demo/Demo.xcodeproj \
            -scheme Demo \
            -derivedDataPath build/DerivedData

       - name: Inspect KeyboardKit API (temporary)
        run: |
          echo "--- Searching for .swiftinterface files ---"
          find build/DerivedData/SourcePackages/artifacts/keyboardkit -iname "*.swiftinterface" || true
          echo "--- Searching for setPreferredKeyboardCase ---"
          grep -rn "setPreferredKeyboardCase" build/DerivedData/SourcePackages/artifacts/keyboardkit --include="*.swiftinterface" || true
          echo "--- Searching for KeyboardBehavior protocol ---"
          grep -rn "protocol KeyboardBehavior" build/DerivedData/SourcePackages/artifacts/keyboardkit --include="*.swiftinterface" || true
          echo "--- Searching for preferredKeyboardCase anywhere ---"
          grep -rn "preferredKeyboardCase" build/DerivedData/SourcePackages/artifacts/keyboardkit --include="*.swiftinterface" || true

      - name: Build for device (Release, unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Demo/Demo.xcodeproj \
            -scheme Demo \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package .ipa
        run: |
          set -e
          APP_PATH=$(find build/DerivedData/Build/Products -type d -name "*.app" | grep -i "iphoneos" | head -n 1)
          echo "Found app at: $APP_PATH"
          rm -rf Payload KeyboardDemo-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/