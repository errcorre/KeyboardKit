name: Build Keyboard

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  device-build:
    name: Build unsigned IPA (device)
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select recent Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.4.1.app

      # Кэшируем библиотеки KeyboardKit, чтобы не качать заново
      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: build/DerivedData/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Inspect KeyboardKit API (temporary)
        run: |
          grep -rn "func setPreferredKeyboardCase" ~/Library/Developer/Xcode/DerivedData/*/SourcePackages/checkouts/KeyboardKit/Sources/ || true
          grep -rn "protocol KeyboardBehavior" ~/Library/Developer/Xcode/DerivedData/*/SourcePackages/checkouts/KeyboardKit/Sources/ || true
          grep -rln "preferredKeyboardCase" ~/Library/Developer/Xcode/DerivedData/*/SourcePackages/checkouts/KeyboardKit/Sources/ || true

      # Сборка сразу под девайс (Release + отключение индексатора)
      - name: Build for device (Release, unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Demo/Demo.xcodeproj \
            -scheme Demo \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package .ipa
        run: |
          set -e
          APP_PATH=$(find build/DerivedData/Build/Products -type d -name "*.app" | grep -i "iphoneos" | head -n 1)
          echo "Found app at: $APP_PATH"
          rm -rf Payload KeyboardDemo-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr KeyboardDemo-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeyboardDemo-unsigned-ipa
          path: KeyboardDemo-unsigned.ipa
          retention-days: 7

      