name: Build Keyboard

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-simulator:
    name: Build (iOS Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Resolve SwiftPM dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Demo/Demo.xcodeproj \
            -scheme Demo

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project Demo/Demo.xcodeproj \
            -scheme Demo \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  device-build:
    name: Build unsigned IPA (device)
    runs-on: macos-15
    timeout-minutes: 25
    needs: build-simulator
    steps:
      - uses: actions/checkout@v4

      - name: Resolve SwiftPM dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Demo/Demo.xcodeproj \
            -scheme Demo

      - name: Build for device (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Demo/Demo.xcodeproj \
            -scheme Demo \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY=""

      - name: Package .ipa
        run: |
          set -e
          APP_PATH=$(find build/DerivedData/Build/Products -maxdepth 2 -name "*.app" -path "*iphoneos*" | head -n1)
          echo "Found app at: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr KeyboardDemo-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeyboardDemo-unsigned-ipa
          path: KeyboardDemo-unsigned.ipa
          retention-days: 7